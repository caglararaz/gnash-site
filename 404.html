<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>Not Found — Gnash</title>
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
:root {
  --green: #34c759;
  --text: #ffffff;
  --text-muted: rgba(255, 255, 255, 0.72);
  --text-faint: rgba(255, 255, 255, 0.62);
  --bg: #1a1a1a;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
}

body { cursor: default; }

a { color: inherit; text-decoration: none; cursor: pointer; }

.doc {
  max-width: 720px;
  margin: 0 auto;
  padding: clamp(48px, 8vw, 96px) clamp(24px, 5vw, 48px);
}

.doc--center { text-align: center; }

.doc .eyebrow {
  margin: 0 0 16px;
  color: var(--green);
  font-size: 16px;
  font-weight: 500;
}

.doc h1 {
  margin: 0 0 32px;
  font-size: clamp(36px, 5vw, 56px);
  line-height: 1.08;
  letter-spacing: -0.025em;
  font-weight: 600;
}

.doc p {
  margin: 0 0 16px;
  font-size: 17px;
  line-height: 1.6;
  color: var(--text-muted);
}

.doc a {
  color: var(--green);
  text-decoration: underline;
  text-decoration-color: rgba(52, 199, 89, 0.4);
  text-underline-offset: 3px;
}

.doc a:hover { text-decoration-color: var(--green); }
</style>
</head>
<body>
<article class="doc doc--center">
  <p class="eyebrow">404</p>
  <h1>Page not found.</h1>
  <p><a href="/">← Back to Gnash</a></p>
</article>
</body>
</html>
